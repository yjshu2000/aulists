<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hex 2^</title>
<link rel="stylesheet" href="style-hex2.css">
<link rel="icon" href="assets/icon-hex2.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Archivo+Black&family=Audiowide&family=Bodoni+Moda:wght@500;700&family=Bruno+Ace+SC&family=Cinzel+Decorative:wght@400;700&family=Della+Respira&family=Eagle+Lake&family=Gloock&family=Iceberg&family=Kings&family=Limelight&family=Marcellus&family=MedievalSharp&family=Metamorphous&family=Modern+Antiqua&family=Orbitron:wght@500;700&family=Philosopher:wght@400;700&family=Pinyon+Script&family=Prata&family=Rampart+One&family=Ribeye&family=Rozha+One&family=Rye&family=Share+Tech+Mono&family=Silkscreen&family=Special+Elite&family=Syncopate:wght@400;700&family=Tenor+Sans&family=Tourney:wght@500;700&family=Trade+Winds&family=Uncial+Antiqua&family=UnifrakturMaguntia&family=Vast+Shadow&family=Yeseva+One&family=Zen+Dots&display=swap" rel="stylesheet">
<meta name="theme-color" content="#12141a">
</head>
<body>

<a class="hexbtn page-nav-top navaway" href="index.html">&larr;&nbsp;Go to Falsedge&nbsp;&larr;</a>
<script>
(function () {
  var data = null;
  try {
    data = localStorage.getItem("falsedge.data");
  } catch (e) {}
  if (!data) {
    document.querySelector(".page-nav-top").remove();
  }
})();
</script>

<header>
  <div class="brand">
    <h1>Hex 2^</h1>
    <small>shamelessly vibecoded</small>
    <small id="mode-name">normal mode</small>
  </div>
  <div class="scores">
    <div class="score"><div class="k">Score</div><div class="v" id="score">0</div></div>
    <div class="score"><div class="k">Best</div><div class="v" id="best">0</div></div>
  </div>
  <div class="row-break"></div>
  <div class="hearts" id="hearts"></div>
  <button class="hexbtn" id="dimtoggle">Dim off</button>
  <button class="hexbtn" id="undo" disabled>&#8630;&nbsp;Undo</button>
  <div class="row-break"></div>
  <button class="hexbtn" id="newgame">New game</button>
  <select id="mode" aria-label="Game mode"></select>
  <button class="hexbtn" id="padtoggle">Click pads on</button>
</header>

<div class="stage">
  <canvas id="board"></canvas>
  <button class="pad pad-up" data-dir="up" aria-label="Slide up"></button>
  <button class="pad pad-ul" data-dir="ul" aria-label="Slide upper left"></button>
  <button class="pad pad-ur" data-dir="ur" aria-label="Slide upper right"></button>
  <button class="pad pad-dl" data-dir="dl" aria-label="Slide lower left"></button>
  <button class="pad pad-dr" data-dir="dr" aria-label="Slide lower right"></button>
  <button class="pad pad-down" data-dir="down" aria-label="Slide down"></button>
  <div class="overlay" id="overlay">
    <div class="card">
      <div class="big" id="ov-big">No moves left</div>
      <div class="sub" id="ov-sub">The board is full.</div>
      <button id="ov-btn">Play again</button>
    </div>
    <canvas class="confetti" id="confetti"></canvas>
  </div>
</div>

<footer>
  Swipe up/down, along <b>/</b>, and along <b>\</b> to slide the board.
</footer>

<div class="lockout" id="lockout">
  <span class="earn" id="earn"><span id="earnNum">+1</span> <img src="assets/icon-grass.svg" alt="grass"></span>
  <button class="fake-ad" id="fake-ad" disabled><span id="fake-ad-label"></span></button>
  <div class="gh-ring" id="gh-ring">
    <div class="gh-face"></div>
    <div class="gh-dial" id="gh-dial"></div>
    <div class="gh-hand" id="gh-hand"></div>
    <div class="gh-hub"></div>
  </div>
  <div class="lockout-card">
    <a class="hexbtn navaway" id="go-falsedge" href="index.html">Go to Falsedge</a>
    <a class="hexbtn navaway" href="aulists.html">Go to Aulists</a>
  </div>
</div>

<script>
(function () {
  // Pick the mode file for this page load. Each mode is a self-booting
  // script that grabs the DOM and binds its own listeners, so only one may
  // ever be present - switching mode reloads the page rather than swapping
  // scripts live. async = false is what keeps core ahead of the mode.
  var mode = "base";
  try {
    var saved = localStorage.getItem("hex2.mode");
    if (saved === "jiggly" || saved === "challenge" ||
        saved === "cascading") {
      mode = saved;
    }
  } catch (e) {
    // storage blocked; fall back to normal mode
  }
  var files = ["hex2-core.js", "hex2-" + mode + ".js"];
  for (var i = 0; i < files.length; i++) {
    var s = document.createElement("script");
    s.src = files[i];
    s.async = false;
    document.body.appendChild(s);
  }
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
