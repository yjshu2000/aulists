<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Falsedge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-colourful.css">
<link rel="stylesheet" href="style-falsedge.css">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12141c">
</head>
<body>

<header>
  <h1>Falsedge</h1>
  <a class="btn" id="hexLink" href="hex2.html"><span class="lbl">&rarr; Go to Hex 2^ &rarr;</span></a>
</header>

<main id="app"></main>

<script>
// Hex 2^ is a timed break: stamp the start so it can lock itself out.
document.getElementById("hexLink").addEventListener("click", function () {
  try {
    localStorage.setItem("hex2.break.start", String(Date.now()));
  } catch (e) {
    // storage blocked; the break just runs untimed
  }
});

// 10s initial block on the button on page loads
// Must match the 10s keyframes in style-falsedge.css.
(function () {
  var link = document.getElementById("hexLink");
  link.classList.add("cooling");
  setTimeout(function () {
    link.classList.remove("cooling");
  }, 10000);
})();
</script>

<div class="page-nav-bottom">
  <a class="btn" href="index.html">&darr; Go to Aulists &darr;</a>
</div>

<div class="undo-redo-pill" id="undoRedoPill">
  <button id="undoBtn" class="ur-btn" aria-label="Undo" disabled>&#8630;</button>
  <button id="redoBtn" class="ur-btn" aria-label="Redo" disabled>&#8631;</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="falsedge.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
